name: unyo
description: "Unyo"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# Version and build number for your app (format: x.y.z+build, can be overridden in flutter build).
version: 1.0.0

environment:
  sdk: ">=3.10.0"
  flutter: ">=3.38.1"

# List your package dependencies below. Run `flutter pub outdated` to check for updates.
dependencies:
  # Flutter SDK dependencies
  flutter:
    sdk: flutter
  # State management
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  rxdart: ^0.28.0
  # Dependency Injection
  get_it: ^9.2.0
  # Logging
  logger: ^2.6.0
  # Code generation
  freezed: ^3.1.0
  freezed_annotation: ^3.1.0 # keep freezed 3.x (4.x is a breaking codegen change)
  json_annotation: ^4.9.0
  # HTTP requests
  http: ^1.6.0
  retry: ^3.1.2
  # Routing and Navigation
  auto_route: ^11.1.0
  auto_route_generator: ^10.4.0
  # UI and Layout
  flutter_screenutil: ^5.9.3
  loading_animation_widget: ^1.3.0
  awesome_snackbar_content: ^0.1.8
  flutter_svg: ^2.2.3
#  fl_chart: ^1.1.1
  dynamic_color: ^2.1.0
  material_color_utilities: ^0.13.0
  palette_generator: ^0.3.3+7
  flutter_colorpicker: ^1.1.0
  # Platform Integration
  window_manager: ^0.5.1
  url_launcher: ^6.3.2
  flutter_discord_rpc: ^1.1.0
  # Media
  smooth_video_progress: ^0.0.4
  fvp: ^0.39.1
  video_player: ^2.14.1
  # Backend/Server
  shelf: ^1.4.2
  # Storage
  path_provider: ^2.1.5
  hive_ce: ^2.16.0
  path: ^1.9.1
  crypto: ^3.0.7
  # Utilities
  collection: ^1.19.1
  fuzzywuzzy: ^1.2.0
#  html: ^0.15.6
  # Localization
  easy_localization: ^3.0.8
  # FFI/Native Integration
  cast: ^2.1.0
  system_info3: ^4.0.2
  jni: ^0.14.2
  meta: ^1.17.0
  jwt_decoder: ^2.0.1
  unyo_lib:
    path: ../unyo-lib
  wakelock_plus: ^1.4.0
  material_ui: ^1.8.0

# Dev dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_lint: ^0.4.1
  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  # Code generation
  hive_ce_generator: ^1.9.2
  json_serializable: ^6.9.5
  build_runner: ^2.10.4
  # Asset Management
  flutter_launcher_icons: ^0.14.4
  icons_launcher: ^3.0.3

dependency_overrides:
  # cast 2.1.0 (stale upstream) is incompatible with bonsoir 7.x
  # (BonsoirDiscoveryEventType renamed). Pin to the last compatible release.
  bonsoir: 5.1.11

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures the Material Icons font is included so you can use the material Icons class.
  uses-material-design: true

  # Assets Application
  assets:
    - assets/i18n/
    - assets/logo.png
    - assets/logo_1.png
    - assets/images/myanimelist.svg
    - assets/images/anilist.svg
    - assets/images/local_account.svg
    - assets/services/torrserver/amd64/linux/torrserver
    - assets/services/torrserver/amd64/macos/torrserver
    - assets/services/torrserver/amd64/windows/torrserver.exe
    - assets/services/torrserver/arm64/linux/torrserver
    - assets/services/torrserver/arm64/macos/torrserver

  # To add custom fonts, add a fonts section in the "flutter" section with a "family" key for the font name and a "fonts" key listing the font assets.
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic

flutter_launcher_icons:
  windows:
    generate: true
    icon_size: 256
    image_path: "assets/logo_1.png"
  macos:
    generate: true
    icon_size: 256
    image_path: "assets/logo_1.png"


icons_launcher:
  image_path: "assets/logo_1.png"
  platforms:
    linux:
      enable: true
