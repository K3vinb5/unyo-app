name: CI

on:
  # PR-only. Post-merge testing lives in release.yml's `test` gate job — the
  # dev lane runs it before any build, so a broken merge produces no release.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # pubspec.yaml points unyo_lib at https://gitea.k3vinb5.dev/Unyo/unyo-lib.git,
      # but a full clone of that repo times out server-side (HTTP 504 after ~90s,
      # it carries ~110MB of committed JREs). A shallow sibling checkout plus the
      # path override resolves in seconds and is what pubspec_overrides.yaml does
      # locally too.
      - name: Vendor unyo_lib for pub resolution
        shell: bash
        env:
          # Analyze/test never touch unyo_lib's binary payloads (jar/JRE — the
          # tests mock AniyomiBridge), so skip Git LFS smudge entirely. Besides
          # saving ~61MB per job, it avoids a 123-request LFS download burst
          # that CrowdSec's crowdsecurity/http-crawl-non_statics on
          # gitea.k3vinb5.dev reads as an aggressive web crawl and answers with
          # a 4h IP ban mid-clone ("batch response: Authorization error") —
          # that is what failed Release run 40409961519. The release *build*
          # jobs do not set this: they need the real files.
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          git clone --depth 1 https://gitea.k3vinb5.dev/Unyo/unyo-lib.git ../unyo-lib
          printf 'dependency_overrides:\n  unyo_lib:\n    path: ../unyo-lib\n  bonsoir: 5.1.11\n' > pubspec_overrides.yaml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install Linux desktop build deps
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update \
              && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev; then
              exit 0
            fi
            echo "apt attempt $i failed; retrying in $((i*10))s"; sleep $((i*10))
          done
          echo "apt-get failed after 3 attempts"; exit 1

      - name: Install project dependencies
        run: flutter pub get

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Generated files must be committed
        run: git diff --exit-code

      # rewrite already carries 24 warnings / 34 infos (0 errors), so only
      # analyzer errors are fatal here. Tighten once the backlog is cleared.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test
