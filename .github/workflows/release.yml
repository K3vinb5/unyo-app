name: Release

on:
  # Dev lane: every merge to the integration branch.
  push:
    branches: [rewrite]
    tags: ['v*']
  # rc / stable lane: dispatch computes the version and, when dry_run is false,
  # the publish job creates the tag. A tag pushed with GITHUB_TOKEN does not
  # re-trigger `push: tags`, so there is no loop.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (default: pubspec version)'
        type: string
        required: false
      channel:
        description: 'Release channel'
        type: choice
        options: [stable, rc]
        default: stable
      dry_run:
        description: 'Build every package and upload artifacts, but do not publish a GitHub release'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  # id-token / attestations are NOT granted here: the build and test jobs run
  # third-party actions and resolve arbitrary pub packages, so OIDC and
  # attestation write are scoped to the `publish` job only (see below).

concurrency:
  # Group by event too: dev builds (push to rewrite) supersede each other, but a
  # dispatch/tag run must never be cancelled by a merge landing mid-release.
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/rewrite' }}

env:
  UNYO_LIB_URL: https://gitea.k3vinb5.dev/Unyo/unyo-lib.git

jobs:
  # Single source of truth for the version. Every build job copies these
  # outputs into its own `steps.ver` step, and the publish job uses them for the
  # tag name, prerelease flag and the post-release bump.
  prepare:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      build_name: ${{ steps.ver.outputs.build_name }}
      lane: ${{ steps.ver.outputs.lane }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      publish: ${{ steps.ver.outputs.publish }}
      bump: ${{ steps.ver.outputs.bump }}
      next_version: ${{ steps.ver.outputs.next_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # pubspec version with the +build metadata stripped: 0.7.0+12 -> 0.7.0
          base="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -n1)"
          if [[ -z "$base" ]]; then
            echo "::error::could not read version: from pubspec.yaml"
            exit 1
          fi
          sha="$(git rev-parse --short=7 HEAD)"

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            requested="${INPUT_VERSION#v}"
            requested="${requested:-$base}"
            if [[ "${INPUT_CHANNEL:-stable}" == "rc" ]]; then
              lane=rc
              tag="v${requested}-rc.${GITHUB_RUN_NUMBER}"
            else
              lane=stable
              tag="v${requested}"
            fi
            if [[ "$INPUT_DRY_RUN" == "false" ]]; then
              publish=true
            else
              publish=false
            fi
          elif [[ "$REF_TYPE" == "tag" ]]; then
            # An existing tag fixes both version and lane.
            tag="$REF_NAME"
            case "$tag" in
              *-dev.*) lane=dev ;;
              *-rc.*) lane=rc ;;
              *) lane=stable ;;
            esac
            publish=true
          else
            # Dev lane: every merge to `rewrite`.
            lane=dev
            tag="v${base}-dev.${GITHUB_RUN_NUMBER}.g${sha}"
            publish=true
          fi

          version="${tag#v}"
          # Flutter's --build-name must stay a plain version: 0.7.0-dev.4.gabc1234 -> 0.7.0
          build_name="${version%%-*}"
          if [[ "$lane" == "stable" ]]; then
            prerelease=false
          else
            prerelease=true
          fi

          # Bump only after a clean stable release: v0.7.0 -> 0.7.1. Test tags
          # with a suffix (v0.0.0-ci-test.2) never bump.
          bump=false
          next_version=""
          if [[ "$lane" == "stable" && "$publish" == "true" && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IFS=. read -r major minor patch <<< "$version"
            next_version="${major}.${minor}.$((patch + 1))"
            bump=true
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_name=$build_name" >> "$GITHUB_OUTPUT"
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"
          {
            echo "### Release version"
            echo ""
            echo "| lane | tag | prerelease | publish | next bump |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| $lane | $tag | $prerelease | $publish | ${next_version:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Post-merge + pre-publish gate (this is the old ci.yml push trigger, folded
  # in so a merge runs one workflow instead of two). Every build job needs it,
  # so a broken merge produces no dev release and a bad tag publishes nothing.
  test:
    name: Analyze & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # pubspec.yaml points unyo_lib at https://gitea.k3vinb5.dev/Unyo/unyo-lib.git,
      # but a full clone of that repo times out server-side (HTTP 504 after ~90s,
      # it carries ~110MB of committed JREs). A shallow sibling checkout plus the
      # path override resolves in seconds and is what pubspec_overrides.yaml does
      # locally too.
      - name: Vendor unyo_lib for pub resolution
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://gitea.k3vinb5.dev/Unyo/unyo-lib.git ../unyo-lib
          printf 'dependency_overrides:\n  unyo_lib:\n    path: ../unyo-lib\n  bonsoir: 5.1.11\n' > pubspec_overrides.yaml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Install Linux desktop build deps
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update \
              && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev; then
              exit 0
            fi
            echo "apt attempt $i failed; retrying in $((i*10))s"; sleep $((i*10))
          done
          echo "apt-get failed after 3 attempts"; exit 1

      - name: Install project dependencies
        run: flutter pub get

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Generated files must be committed
        run: git diff --exit-code

      # rewrite already carries 24 warnings / 34 infos (0 errors), so only
      # analyzer errors are fatal here. Tighten once the backlog is cleared.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

  linux:
    name: Linux (zip, AppImage, deb)
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # See .github/workflows/ci.yml for why the git dependency is vendored with
      # a shallow sibling checkout instead of being resolved by pub directly.
      - name: Vendor unyo_lib for pub resolution
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 "$UNYO_LIB_URL" ../unyo-lib
          printf 'dependency_overrides:\n  unyo_lib:\n    path: ../unyo-lib\n  bonsoir: 5.1.11\n' > pubspec_overrides.yaml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=${{ needs.prepare.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ needs.prepare.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "build_name=${{ needs.prepare.outputs.build_name }}" >> "$GITHUB_OUTPUT"

      - name: Install Linux build deps
        run: |
          for i in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update \
              && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libfuse2; then
              exit 0
            fi
            echo "apt attempt $i failed; retrying in $((i*10))s"; sleep $((i*10))
          done
          echo "apt-get failed after 3 attempts"; exit 1

      - name: Install project dependencies
        run: flutter pub get

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build
        run: >-
          flutter build linux --release
          --build-name "${{ steps.ver.outputs.build_name }}"
          --build-number "${{ github.run_number }}"

      - name: Copy custom JRE into bundle
        run: bash scripts/copy_jre.sh linux

      - name: Package zip
        run: |
          set -euo pipefail
          mkdir -p dist
          cd build/linux/x64/release/bundle
          zip -r -y "$GITHUB_WORKSPACE/dist/Unyo-${{ steps.ver.outputs.tag }}-linux.zip" .

      - name: Package AppImage
        run: |
          set -euo pipefail
          cp -r linux-appimage/Unyo.AppDir dist/Unyo.AppDir
          cp -r build/linux/x64/release/bundle/. dist/Unyo.AppDir/
          cp linux-appimage/appimagetool.AppImage dist/appimagetool.AppImage
          chmod 755 dist/appimagetool.AppImage
          ARCH=x86_64 ./dist/appimagetool.AppImage \
            dist/Unyo.AppDir "dist/Unyo-${{ steps.ver.outputs.tag }}-linux.AppImage"
          rm -rf dist/Unyo.AppDir dist/appimagetool.AppImage

      - name: Package deb
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          version="${{ steps.ver.outputs.version }}"
          root="dist/deb-root"
          mkdir -p "$root/DEBIAN" "$root/usr/lib/unyo" "$root/usr/bin" \
                   "$root/usr/share/applications" "$root/usr/share/icons/hicolor/512x512/apps"
          cp -r build/linux/x64/release/bundle/. "$root/usr/lib/unyo/"
          ln -s /usr/lib/unyo/unyo "$root/usr/bin/unyo"
          cp linux-appimage/Unyo.AppDir/Unyo.desktop "$root/usr/share/applications/unyo.desktop"
          # Unyo.desktop refers to Icon=logo
          cp linux-appimage/logo.png "$root/usr/share/icons/hicolor/512x512/apps/logo.png"
          {
            echo "Package: unyo"
            echo "Version: $version"
            echo "Architecture: amd64"
            echo "Maintainer: Kevin Borges <k3vinb5@users.noreply.github.com>"
            echo "Section: video"
            echo "Priority: optional"
            echo "Installed-Size: $(du -sk "$root/usr" | cut -f1)"
            echo "Description: Anime streaming and manga reader desktop app"
            echo " Unyo is an ad-free anime streaming and manga reader for the desktop."
          } > "$root/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$root" "dist/Unyo-$tag-linux.deb"
          rm -rf "$root"
          deb_version=$(dpkg-deb -f "dist/Unyo-$tag-linux.deb" Version)
          echo "deb Version: $deb_version"
          if [ "$deb_version" != "$version" ]; then
            echo "::error::deb Version '$deb_version' does not match tag version '$version'"
            exit 1
          fi

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum Unyo-* > SHA256SUMS
          cat SHA256SUMS

      # SPDX SBOM of the shipped bundle (app + bundled custom JRE), so the
      # release has a machine-readable inventory of what it contains.
      # Integrity extra, never fatal: a syft/anchore failure must not take the
      # platform's packages down with it (best-effort release policy).
      - name: Generate SPDX SBOM
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          path: build/linux/x64/release/bundle
          format: spdx-json
          output-file: dist/sbom-linux.spdx.json
          artifact-name: sbom-linux
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          if-no-files-found: error
          path: |
            dist/Unyo-*
            dist/SHA256SUMS
            dist/sbom-*.spdx.json

  windows:
    name: Windows (zip, Inno setup)
    needs: [prepare, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vendor unyo_lib for pub resolution
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 "$UNYO_LIB_URL" ../unyo-lib
          printf 'dependency_overrides:\n  unyo_lib:\n    path: ../unyo-lib\n  bonsoir: 5.1.11\n' > pubspec_overrides.yaml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      # JDK 17 is needed twice: the jni plugin's CMake build links against
      # jvm.lib, and jlink produces the custom JRE below.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=${{ needs.prepare.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ needs.prepare.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "build_name=${{ needs.prepare.outputs.build_name }}" >> "$GITHUB_OUTPUT"

      - name: Install project dependencies
        run: flutter pub get

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build
        run: >-
          flutter build windows --release
          --build-name "${{ steps.ver.outputs.build_name }}"
          --build-number "${{ github.run_number }}"

      - name: Build custom JRE (jlink)
        shell: pwsh
        run: |
          $jre = "build/windows/x64/runner/Release/jre/customjre"
          # jlink refuses to write into an existing directory
          New-Item -ItemType Directory -Force -Path (Split-Path $jre -Parent) | Out-Null
          if (Test-Path $jre) { Remove-Item -Recurse -Force $jre }
          & "$env:JAVA_HOME\bin\jlink.exe" `
            --module-path "$env:JAVA_HOME\jmods" `
            --add-modules java.base,java.instrument,java.prefs,java.sql,jdk.management,jdk.unsupported,jdk.crypto.cryptoki,jdk.crypto.ec,java.security.jgss,jdk.zipfs `
            --output $jre `
            --strip-debug --no-man-pages --no-header-files --compress=2

      # unyo_lib ships no Windows JRE, so the platform bits that live in
      # jre/<os>/customjre/lib/server on linux/macos are assembled here.
      - name: Add Dart-JNI bits to the Windows JRE
        shell: bash
        run: |
          set -euo pipefail
          release="build/windows/x64/runner/Release"
          server="$release/jre/customjre/lib/server"
          mkdir -p "$server"
          # dartjni.dll: built by the jni plugin's MSVC build during
          # `flutter build windows` and shipped next to the exe.
          cp "$release/dartjni.dll" "$server/dartjni.dll"
          # jni.jar: pure Java, identical on every platform — take it from the
          # unyo_lib checkout.
          unyo_lib=$(bash scripts/copy_jre.sh --unyo-lib-dir)
          cp "$unyo_lib/jre/linux/customjre/lib/server/jni.jar" "$server/jni.jar"
          # jvm.dll sits in bin/server after jlink; mirror it into lib/server the
          # way linux/macos put libjvm there.
          cp "$release/jre/customjre/bin/server/jvm.dll" "$server/jvm.dll"

      # Loud check rather than a silent skip: the Windows JRE bundle is
      # assembled here and must at least be complete before we ship it. NOTE:
      # the JVM is located by the delay-loaded jvm.dll at runtime, which is not
      # verified by this workflow (no Windows JRE exists upstream to compare
      # against) — see the PR description.
      - name: Verify Windows JRE bundle
        shell: bash
        run: |
          set -euo pipefail
          server="build/windows/x64/runner/Release/jre/customjre/lib/server"
          missing=0
          for file in jni.jar dartjni.dll jvm.dll; do
            if [ -f "$server/$file" ]; then
              echo "ok: $server/$file"
            else
              echo "::error::missing $server/$file"
              missing=1
            fi
          done
          if [ ! -f "build/windows/x64/runner/Release/jre/customjre/bin/java.dll" ]; then
            echo "::error::jlink output looks incomplete (bin/java.dll missing)"
            missing=1
          fi
          echo "::warning::Windows JRE runtime loading (delay-loaded jvm.dll) is not verified by this workflow"
          exit $missing

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "dist\Unyo-${{ steps.ver.outputs.tag }}-windows.zip"

      # InnoDependencyInstaller supplies the [Code] helpers that install the
      # VC++ 2015-2022 redistributable, included by windows-inno-script.iss as
      # build\inno-depend\CodeDependencies.iss (relative to the script at the
      # repo root), so the checkout has to land exactly there.
      - name: Fetch InnoDependencyInstaller
        shell: bash
        run: git clone --depth 1 https://github.com/DomGries/InnoDependencyInstaller build/inno-depend

      - name: Build Windows installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: windows-inno-script.iss
          options: /O+ /dMyAppVersion=${{ steps.ver.outputs.tag }}

      - name: Collect installer
        shell: bash
        run: |
          set -euo pipefail
          src=$(ls build/windows/x64/runner/Unyo-*-windows-setup.exe | head -n 1)
          cp "$src" "dist/Unyo-${{ steps.ver.outputs.tag }}-windows-setup.exe"
          ls -l dist

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum Unyo-* > SHA256SUMS
          cat SHA256SUMS

      # SPDX SBOM of the shipped bundle (app + bundled custom JRE).
      # Integrity extra, never fatal (see the linux job).
      - name: Generate SPDX SBOM
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          path: build/windows/x64/runner/Release
          format: spdx-json
          output-file: dist/sbom-windows.spdx.json
          artifact-name: sbom-windows
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          if-no-files-found: error
          path: |
            dist/Unyo-*
            dist/SHA256SUMS
            dist/sbom-*.spdx.json

  macos:
    name: macOS (zip, dmg)
    needs: [prepare, test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vendor unyo_lib for pub resolution
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 "$UNYO_LIB_URL" ../unyo-lib
          printf 'dependency_overrides:\n  unyo_lib:\n    path: ../unyo-lib\n  bonsoir: 5.1.11\n' > pubspec_overrides.yaml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=${{ needs.prepare.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ needs.prepare.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "build_name=${{ needs.prepare.outputs.build_name }}" >> "$GITHUB_OUTPUT"

      - name: Install project dependencies
        run: flutter pub get

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build
        run: >-
          flutter build macos --release
          --build-name "${{ steps.ver.outputs.build_name }}"
          --build-number "${{ github.run_number }}"

      - name: Copy custom JRE into bundle
        run: bash scripts/copy_jre.sh macos

      - name: Package zip
        run: |
          set -euo pipefail
          mkdir -p dist
          cd build/macos/Build/Products/Release
          zip -r -y "$GITHUB_WORKSPACE/dist/Unyo-${{ steps.ver.outputs.tag }}-macos.zip" unyo.app

      - name: Package dmg
        run: |
          set -euo pipefail
          brew install create-dmg
          # flag names differ across create-dmg versions (--no-code-sign was
          # unknown to the 1.3.0 bottle); pass it only when supported
          sign_flag=""
          if create-dmg --help 2>&1 | grep -q -- '--no-code-sign'; then
            sign_flag="--no-code-sign"
          fi
          create-dmg \
            ${sign_flag:+$sign_flag} \
            --volname "Unyo-${{ steps.ver.outputs.tag }}-macos" \
            --window-pos 200 120 --window-size 800 450 --icon-size 100 \
            --app-drop-link 600 185 \
            "dist/Unyo-${{ steps.ver.outputs.tag }}-macos.dmg" \
            build/macos/Build/Products/Release/unyo.app

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 Unyo-* > SHA256SUMS
          cat SHA256SUMS

      # SPDX SBOM of the shipped bundle (app + bundled custom JRE).
      # Integrity extra, never fatal (see the linux job).
      - name: Generate SPDX SBOM
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          path: build/macos/Build/Products/Release/unyo.app
          format: spdx-json
          output-file: dist/sbom-macos.spdx.json
          artifact-name: sbom-macos
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          if-no-files-found: error
          path: |
            dist/Unyo-*
            dist/SHA256SUMS
            dist/sbom-*.spdx.json

  publish:
    name: Publish GitHub release
    needs: [prepare, linux, windows, macos]
    # Best effort: publish whatever platforms succeeded — one failing platform
    # does not block the release, its absence is called out in the release body.
    # A failed `test` gate skips the build jobs entirely, so a broken merge
    # still publishes nothing. `!cancelled()` keeps a manual cancel from
    # publishing a half-built release.
    if: ${{ !cancelled() && needs.prepare.outputs.publish == 'true' && (needs.linux.result == 'success' || needs.windows.result == 'success' || needs.macos.result == 'success') }}
    runs-on: ubuntu-latest
    # Only this job needs OIDC + attestation write (build-provenance attestation
    # of the release assets). Scoped here instead of workflow-wide so the test
    # and build jobs — which run third-party actions and resolve arbitrary pub
    # packages — cannot mint tokens or write attestations.
    permissions:
      contents: write
      id-token: write
      attestations: write
    # `secrets` is not usable directly in a step `if:`, so the presence check is
    # surfaced as an env flag. Empty secret => GPG signing steps are skipped.
    env:
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      # fetch-depth 0 + tags: the changelog is generated from the full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Regenerate checksums over every asset
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -name SHA256SUMS -delete
          shopt -s nullglob
          files=(Unyo-* sbom-*.spdx.json)
          shopt -u nullglob
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      # Detached ASCII-armored signature over the published SHA256SUMS. Skipped
      # silently when no key is configured, so secretless runs stay green.
      # (Signed here, not per build job: this job regenerates SHA256SUMS over
      # all collected assets, so a signature made earlier would not match it.)
      - name: Sign checksums (GPG)
        if: ${{ env.HAS_GPG_KEY == 'true' }}
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd dist
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          key_id="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
          pass_args=()
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            pass_args=(--pinentry-mode loopback --passphrase "$GPG_PASSPHRASE")
          fi
          gpg --batch "${pass_args[@]}" --local-user "$key_id" \
            --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          gpg --verify SHA256SUMS.asc SHA256SUMS
          echo "::notice::SHA256SUMS.asc signed with key $key_id"

      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          [ "${{ needs.linux.result }}" = "success" ] || missing="$missing Linux"
          [ "${{ needs.windows.result }}" = "success" ] || missing="$missing Windows"
          [ "${{ needs.macos.result }}" = "success" ] || missing="$missing macOS"
          if [ -n "$missing" ]; then
            printf '> [!WARNING]\n> Best-effort release — the %s build(s) failed; no assets for those platforms.\n' "${missing# }" > dist/release-body.md
          else
            : > dist/release-body.md
          fi
          cat dist/release-body.md

      # Changelog from git history. Best effort on purpose: a git-cliff or
      # template problem must never block a release — the warning-only body
      # from the step above is then used as-is.
      # NOTE: the action has no `output` input. Its run.sh pulls the output path
      # out of `-o/--output` in `args` and defaults to git-cliff/CHANGELOG.md, so
      # the path has to be passed through args or dist/changelog.md never exists.
      - name: Generate changelog
        id: changelog
        continue-on-error: true
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --latest --output dist/changelog.md

      - name: Append changelog to release notes
        shell: bash
        run: |
          set -euo pipefail
          if [ -s dist/changelog.md ]; then
            { cat dist/release-body.md; printf '\n'; cat dist/changelog.md; } > dist/release-body.tmp
            mv dist/release-body.tmp dist/release-body.md
          else
            echo "::notice::changelog unavailable; releasing with the plain body"
          fi
          cat dist/release-body.md

      # Explicit, existing-files-only subject list (globs alone are unsafe here:
      # a wildcard-free path such as SHA256SUMS.asc is not dropped by nullglob).
      - name: Collect attestation subjects
        id: subjects
        shell: bash
        run: |
          set -euo pipefail
          subjects=()
          shopt -s nullglob
          for f in dist/Unyo-* dist/sbom-*.spdx.json dist/SHA256SUMS dist/SHA256SUMS.asc; do
            [ -f "$f" ] || continue
            subjects+=("$f")
          done
          shopt -u nullglob
          if [ ${#subjects[@]} -eq 0 ]; then
            echo "::error::no release assets found to attest"
            exit 1
          fi
          {
            echo "paths<<SUBJECTS_EOF"
            printf '%s\n' "${subjects[@]}"
            echo "SUBJECTS_EOF"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' "${subjects[@]}"

      # `gh attestation verify <asset> -R <owner>/<repo>` uses this.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}

      # tag_name comes from the prepare job, so dispatch runs create the tag
      # here (softprops does that when the tag does not exist yet).
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          body_path: dist/release-body.md
          # Exactly the attested/checksummed assets: packages, Sboms, SHA256SUMS
          # and (when a key is configured) SHA256SUMS.asc.
          files: ${{ steps.subjects.outputs.paths }}

      # Stable releases only (bump is false for dev/rc and for suffixed test
      # tags). Requires a COMPLETE release — a best-effort release missing a
      # platform must not consume the version number. Commits the patch bump
      # straight to `rewrite` — fully automatic, no PR to merge. `[skip ci]`
      # keeps the bump commit from triggering the dev lane.
      - name: Bump version on rewrite
        if: ${{ needs.prepare.outputs.bump == 'true' && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ needs.prepare.outputs.next_version }}
          RELEASED_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags origin rewrite
          git checkout -B rewrite origin/rewrite
          # Build number restarts at 1 for the new version.
          sed -i -E "s/^version:.*/version: ${NEXT_VERSION}+1/" pubspec.yaml
          git add pubspec.yaml
          git commit -m "chore: bump version to ${NEXT_VERSION} after release [skip ci]"
          # Rebase on whatever landed on rewrite while the release was running,
          # then push. A rejected push means concurrent commits won the race —
          # the release itself is already published, so report and move on.
          if ! git pull --rebase --no-tags origin rewrite; then
            git rebase --abort || true
            echo "::warning::bump rebase failed; rewrite moved during release — bump ${NEXT_VERSION} needs a manual commit"
            exit 0
          fi
          if ! git push origin rewrite; then
            echo "::warning::bump push rejected; rewrite moved during release — bump ${NEXT_VERSION} needs a manual commit"
            exit 0
          fi
          echo "::notice::bumped version to ${NEXT_VERSION}+1 on rewrite after ${RELEASED_TAG}"

  # Downstream distribution channels (Homebrew cask, AUR, Scoop) each own a Gitea
  # repo with an update script that pins one release asset. They are bumped here,
  # after a clean stable release, so a published version never sits behind on
  # a channel for long.
  #
  # This job is deliberately NOT part of the release's critical path: it runs
  # after `publish` and a failure inside it turns only this job red — the GitHub
  # release, its assets, checksums, attestation and signature are already out.
  # A channel whose platform asset is missing from the release is skipped
  # instead of failed (best-effort releases publish whatever platform built).
  #
  # Requires a GITEA_TOKEN secret (a Gitea PAT on gitea.k3vinb5.dev with write
  # access to Unyo/homebrew-unyo, Unyo/unyo-aur and Unyo/scoop-unyo). Without it
  # the whole job skips silently, the same policy as the GPG signing step.
  bump-channels:
    name: Bump distribution channels (Homebrew, AUR, Scoop)
    needs: [prepare, publish]
    # Reuses the prepare job's computed lane/tag — never re-derives the version.
    # `bump` is true only for lane=stable + publish (not dry_run) + bare X.Y.Z.
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.prepare.outputs.lane == 'stable' && needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.bump == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # `secrets` cannot be used directly in a step `if:`; surface presence here.
      HAS_GITEA_TOKEN: ${{ secrets.GITEA_TOKEN != '' }}
      RELEASED_TAG: ${{ needs.prepare.outputs.tag }}
      GITEA_HOST: gitea.k3vinb5.dev/Unyo
    steps:
      - name: No Gitea credentials
        if: ${{ env.HAS_GITEA_TOKEN != 'true' }}
        shell: bash
        run: echo "::notice::GITEA_TOKEN is not configured; Homebrew/AUR/Scoop bumps skipped (the release itself is unaffected)"

      # Asset names come from the Package steps above:
      #   Unyo-<tag>-linux.zip / -linux.AppImage / -linux.deb
      #   Unyo-<tag>-windows.zip / -windows-setup.exe
      #   Unyo-<tag>-macos.zip / -macos.dmg
      # Each channel is gated on its own input asset existing in the release.
      - name: Detect channel input assets
        id: assets
        if: ${{ env.HAS_GITEA_TOKEN == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          names="$(gh release view "$RELEASED_TAG" --json assets --jq '.assets[].name')"
          printf '%s\n' "$names"
          for pair in cask:macos.dmg aur:linux.zip scoop:windows.zip; do
            channel="${pair%%:*}"
            asset="Unyo-${RELEASED_TAG}-${pair#*:}"
            if grep -Fxq "$asset" <<< "$names"; then
              echo "has_${channel}=true" >> "$GITHUB_OUTPUT"
              echo "ok: $asset present for the ${channel} channel"
            else
              echo "has_${channel}=false" >> "$GITHUB_OUTPUT"
              echo "::notice::${asset} is not in ${RELEASED_TAG}; ${channel} channel left untouched"
            fi
          done

      # The token goes into the clone URL (Gitea accepts x-access-token) and is
      # masked before anything else runs; the clone lives in a temp dir and is
      # removed on exit, so it never lands in the workspace or the artifact set.
      - name: Bump Homebrew cask (homebrew-unyo)
        if: ${{ env.HAS_GITEA_TOKEN == 'true' && steps.assets.outputs.has_cask == 'true' }}
        continue-on-error: false
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GITEA_TOKEN"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git clone --depth 1 "https://x-access-token:${GITEA_TOKEN}@${GITEA_HOST}/homebrew-unyo.git" "$tmp/homebrew-unyo"
          cd "$tmp/homebrew-unyo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # update-cask.sh downloads the dmg itself and rewrites the cask.
          ./update-cask.sh "$RELEASED_TAG"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::homebrew-unyo already at ${RELEASED_TAG}; nothing to commit"
            exit 0
          fi
          git commit -m "chore: bump unyo to ${RELEASED_TAG}"
          git push origin HEAD

      - name: Bump AUR package (unyo-aur)
        if: ${{ env.HAS_GITEA_TOKEN == 'true' && steps.assets.outputs.has_aur == 'true' }}
        continue-on-error: false
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GITEA_TOKEN"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git clone --depth 1 "https://x-access-token:${GITEA_TOKEN}@${GITEA_HOST}/unyo-aur.git" "$tmp/unyo-aur"
          cd "$tmp/unyo-aur"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # update-pkgbuild.sh pins the linux.zip and refreshes .SRCINFO.
          ./update-pkgbuild.sh "$RELEASED_TAG"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::unyo-aur already at ${RELEASED_TAG}; nothing to commit"
            exit 0
          fi
          git commit -m "chore: bump unyo to ${RELEASED_TAG}"
          git push origin HEAD

      - name: Bump Scoop manifest (scoop-unyo)
        if: ${{ env.HAS_GITEA_TOKEN == 'true' && steps.assets.outputs.has_scoop == 'true' }}
        continue-on-error: false
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GITEA_TOKEN"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git clone --depth 1 "https://x-access-token:${GITEA_TOKEN}@${GITEA_HOST}/scoop-unyo.git" "$tmp/scoop-unyo"
          cd "$tmp/scoop-unyo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # update-manifest.sh [path/to/SHA256SUMS] is optional; without it the
          # script downloads the checksums from the release itself.
          ./update-manifest.sh "$RELEASED_TAG"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::scoop-unyo already at ${RELEASED_TAG}; nothing to commit"
            exit 0
          fi
          git commit -m "chore: bump unyo to ${RELEASED_TAG}"
          git push origin HEAD

  # Chocolatey is the last unwired channel. Unlike the Gitea channel repos above,
  # the package definition lives in this repository (packaging/chocolatey), so the
  # job checks out this repo, renders the placeholders, packs and pushes to the
  # community feed. Runs on windows-latest because `choco` ships preinstalled.
  #
  # Same gating as bump-channels — clean stable release only (lane=stable,
  # publish=true i.e. not dry_run, and a bare X.Y.Z version, which `bump` encodes)
  # — and it skips silently when no API key secret exists, like the GPG and
  # GITEA_TOKEN steps. Like bump-channels it is off the release's critical path:
  # the GitHub release is already out before this runs.
  chocolatey:
    name: Publish Chocolatey package
    needs: [prepare, publish]
    # Reuses the prepare job's computed lane/version/tag — never re-derives them.
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.prepare.outputs.lane == 'stable' && needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.bump == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # `secrets` is not usable directly in a step `if:`, so surface presence here.
      HAS_CHOCO_KEY: ${{ secrets.CHOCO_API_KEY != '' }}
      RELEASED_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: No Chocolatey API key
        if: ${{ env.HAS_CHOCO_KEY != 'true' }}
        shell: bash
        run: echo "::notice::CHOCO_API_KEY is not configured; Chocolatey publish skipped (the release itself is unaffected)"

      # render.sh matches anchored patterns such as `^  [0-9a-f]{64}$` against the
      # committed (LF) templates. A Windows checkout with core.autocrlf would rewrite
      # them to CRLF and those anchors would stop matching, so pin LF job-wide before
      # the checkout runs.
      - name: Keep packaging files LF
        if: ${{ env.HAS_CHOCO_KEY == 'true' }}
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        if: ${{ env.HAS_CHOCO_KEY == 'true' }}
        uses: actions/checkout@v4

      # The checksums come from the published release, not from a rebuild: the
      # nuspec/install script must pin exactly what users download. A best-effort
      # release without a Windows installer is skipped, like an absent channel
      # asset above.
      - name: Download release checksums
        id: sums
        if: ${{ env.HAS_CHOCO_KEY == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset="Unyo-${RELEASED_TAG}-windows-setup.exe"
          dir="$RUNNER_TEMP/choco"
          mkdir -p "$dir"
          gh release download "$RELEASED_TAG" --pattern SHA256SUMS --dir "$dir" --clobber
          # Compare the extracted filename exactly instead of regex-matching the
          # asset: `sha256sum` writes `<hash>  <name>` (two spaces, sometimes a
          # leading `*` for binary mode, and a `./` prefix only when the file was
          # passed with one), so a pattern that requires a literal `.` misses the
          # real bare-name line. Each line's second field is stripped of `*`/`./`
          # and compared verbatim, so the dots in the asset name need no escaping.
          if awk -v want="$asset" '
            {
              name = $2
              sub(/^\*/, "", name)
              sub(/^\.\//, "", name)
              if (name == want) found = 1
            }
            END { exit(found ? 0 : 1) }
          ' "$dir/SHA256SUMS"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${asset} is not in ${RELEASED_TAG}/SHA256SUMS; Chocolatey package not published for this release"
          fi

      - name: Render package
        if: ${{ env.HAS_CHOCO_KEY == 'true' && steps.sums.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/chocolatey/render.sh "$RELEASE_VERSION" "$RUNNER_TEMP/choco/SHA256SUMS"
          git diff --stat

      # The key reaches choco through the environment and is masked before the
      # first command; it is never interpolated into a run block or a file.
      - name: Pack and push
        if: ${{ env.HAS_CHOCO_KEY == 'true' && steps.sums.outputs.ready == 'true' }}
        shell: bash
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          set -euo pipefail
          echo "::add-mask::$CHOCO_API_KEY"
          cd packaging/chocolatey
          choco pack unyo.nuspec
          nupkg="unyo.${RELEASE_VERSION}.nupkg"
          ls -l "$nupkg"
          choco push "$nupkg" --source https://push.chocolatey.org/ --key "$CHOCO_API_KEY"
